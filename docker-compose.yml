# Sobe a página já gerada pela imagem (o mesmo modo da publicação).
# Não é o ajuste de planos: esse fica na máquina, com LHAMALOG_AJUSTE_PLANOS=1 npm run dev.
# Uso (na raiz do repositório): docker compose up --build
#   ou: make run
name: lhamalog-page-local

services:
  page:
    build:
      context: .
      dockerfile: Dockerfile
    image: lhamalog-page
    container_name: lhamalog-page
    restart: "no"
    ports:
      - "3000:3000"
